<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paper2Video 论文介绍与讲解工坊项目汇报，连接真实课程体验和工作台进阶演示。" />
    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem('paper2video.theme'); } catch (e) {}
        var mode = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('theme-mode', mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <title>论文与项目汇报 · 讲解工坊</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/presentation/main.tsx"></script>
  </body>
</html>
