<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="用真实教材、教案、课件和成片，体验讲解工坊从素材到讲解视频的完整流程。" />
    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem('paper2video.theme'); } catch (e) {}
        var mode = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('theme-mode', mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <title>流程体验 · 讲解工坊</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
